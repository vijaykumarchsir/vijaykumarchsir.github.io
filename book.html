<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book | Vijay Kumar Ch, English Educator</title><meta name="description" content="Book English tuition with Vijay Kumar Ch on WhatsApp or by form.">
<link rel="stylesheet" href="css/site.css"></head><body>
<a class="skip" href="#main">Skip to content</a><header id="site-header"></header>
<main id="main" class="wrap">
<h1>Book or reach out</h1>
<p class="lead">Fastest way: WhatsApp. Prefer writing? Use the form.</p>
<p><a class="btn" href="https://wa.me/916302479339?text=Hi%2C%20I%E2%80%99d%20like%20to%20enquire%20about%20English%20tuition." rel="noopener" target="_blank">Chat on WhatsApp</a></p>
<h2>Tuition and materials</h2>
<form action="https://formsubmit.co/vijaykumarchsir@gmail.com" method="POST">
<input type="hidden" name="_subject" value="New enquiry from website">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_next" id="next" value="">
<div class="hp" aria-hidden="true"><label for="gotcha">Leave blank</label><input id="gotcha" type="text" name="_gotcha" tabindex="-1" autocomplete="off"></div>
<div><label for="name">Name</label><input id="name" name="name" required autocomplete="name"></div>
<div><label for="phone">Phone / WhatsApp</label><input id="phone" name="phone" type="tel" required autocomplete="tel"></div>
<div><label for="email">Email <span class="note">(optional)</span></label><input id="email" name="email" type="email" autocomplete="email"></div>
<div><label for="purpose">Purpose</label><select id="purpose" name="purpose" required><option>Tuition</option><option>Materials</option><option>Other</option></select></div>
<div><label for="board">Board / Curriculum</label>
<select id="board" name="board">
<option value="">Select a board</option>
<option>CBSE</option>
<option>ICSE</option>
<option>Cambridge</option>
<option>IB</option>
<option>Other</option>
</select></div>
<div><label for="grade">Grade <span class="note">(optional)</span></label><input id="grade" name="grade" placeholder="e.g. Grade 9"></div>
<div><label for="message">Message</label><textarea id="message" name="message" rows="5" required></textarea></div>
<button class="btn" type="submit">Send</button>
<p class="note">Your details are used only to reply to you. For comments on lessons, <a href="feedback-submit.html">send feedback</a>.</p>
</form>
</main><footer id="site-footer"></footer><script src="js/site.js"></script></body></html>
